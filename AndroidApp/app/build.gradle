plugins {
    id "com.android.application"
}

android {
    namespace "com.ffarena.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.ffarena.app"
        minSdk 23
        targetSdk 35
        versionCode (project.findProperty("versionCode") ?: "1").toString().toInteger()
        versionName "1.0." + (project.findProperty("versionCode") ?: "1").toString()
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
