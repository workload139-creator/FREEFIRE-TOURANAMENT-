name: Build and Publish FF Arena Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/pwa-android-apk
    paths:
      - "AndroidApp/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK manager
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager was not found on this runner."
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Android SDK platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Android release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing repository secret: ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ffarena-upload-key.jks"
          test -s "$RUNNER_TEMP/ffarena-upload-key.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/ffarena-upload-key.jks" >> "$GITHUB_ENV"

      - name: Validate Android release keystore password
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "Missing signing password or key alias secret."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/ffarena-upload-key.jks" -storetype PKCS12 -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "Keystore validation failed. Check that ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, and ANDROID_KEY_ALIAS belong to the same keystore. Secret values were not printed."
            exit 1
          fi
          echo "Keystore file, store password, and alias validated successfully."

      - name: Build debug APK and signed release AAB
        working-directory: AndroidApp
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleDebug bundleRelease -PversionCode=${{ github.run_number }}

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ff-arena-android-builds
          path: |
            AndroidApp/app/build/outputs/apk/debug/app-debug.apk
            AndroidApp/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK and AAB download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ff-arena-latest
          name: FF Arena Android Builds
          body: |
            FF Arena Android app builds.
            app-debug.apk: debug-signed APK for direct testing.
            app-release.aab: release-signed Android App Bundle for Play Console upload.
            versionCode: ${{ github.run_number }}
            Publishing the AAB does not guarantee Google Play policy eligibility.
          files: |
            AndroidApp/app/build/outputs/apk/debug/app-debug.apk
            AndroidApp/app/build/outputs/bundle/release/app-release.aab
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
