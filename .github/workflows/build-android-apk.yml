name: Build and Publish FF Arena Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/pwa-android-apk
    paths:
      - "AndroidApp/**"
      - ".github/workflows/build-android-apk.yml"
  pull_request:
    branches:
      - main
    paths:
      - "AndroidApp/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

jobs:
  android-pr-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK manager
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager was not found on this runner."
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Android SDK platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compile debug APK (no release signing or publishing)
        working-directory: AndroidApp
        run: gradle --no-daemon assembleDebug -PversionCode=1

  build-android:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK manager
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager was not found on this runner."
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Android SDK platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Android release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing repository secret: ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          # Normalize copied Base64 in case it contains wrapped lines or spaces.
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 --decode > "$RUNNER_TEMP/ffarena-upload-key"
          test -s "$RUNNER_TEMP/ffarena-upload-key"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/ffarena-upload-key" >> "$GITHUB_ENV"
          echo "Decoded signing file successfully (file size: $(wc -c < "$RUNNER_TEMP/ffarena-upload-key") bytes)."
          file "$RUNNER_TEMP/ffarena-upload-key" || true

      - name: Validate Android release keystore password
        id: validate_signing
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets are missing. The debug APK will still be built."
          fi
          STORE_TYPE=""
          if keytool -list -keystore "$RUNNER_TEMP/ffarena-upload-key" -storetype PKCS12 -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            STORE_TYPE="PKCS12"
          elif keytool -list -keystore "$RUNNER_TEMP/ffarena-upload-key" -storetype JKS -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            STORE_TYPE="JKS"
          fi
          if [ -z "$STORE_TYPE" ]; then
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::error::The decoded file is not opening as PKCS12 or JKS with the provided password. Check the Base64 secret is copied from the same keystore file and the password matches. The workflow will not print or expose secrets."
          elif ! keytool -list -keystore "$RUNNER_TEMP/ffarena-upload-key" -storetype "$STORE_TYPE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::error::Keystore password is valid but the alias was not found. Confirm ANDROID_KEY_ALIAS matches the alias inside your keystore."
          else
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "Keystore validated. Detected store type: $STORE_TYPE"
            echo "ANDROID_KEYSTORE_STORE_TYPE=$STORE_TYPE" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        working-directory: AndroidApp
        run: |
          gradle --no-daemon assembleDebug -PversionCode=${{ github.run_number }}

      - name: Build signed release AAB
        if: steps.validate_signing.outputs.valid == 'true'
        working-directory: AndroidApp
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Missing repository secret: ANDROID_KEY_PASSWORD"
            exit 1
          fi
          gradle --no-daemon assembleRelease bundleRelease -PversionCode=${{ github.run_number }}

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ff-arena-android-apk
          path: AndroidApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed release APK artifact
        if: steps.validate_signing.outputs.valid == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ff-arena-android-release-apk
          path: AndroidApp/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed AAB artifact
        if: steps.validate_signing.outputs.valid == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ff-arena-android-aab
          path: AndroidApp/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK and AAB download
        if: steps.validate_signing.outputs.valid == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ff-arena-latest
          name: FF Arena Android Builds
          body: |
            FF Arena Android app builds.
            app-release.apk: release-signed APK for updating installed Android apps.
            app-debug.apk: debug APK for testing only.
            app-release.aab: release-signed Android App Bundle for Play Console upload.
            versionCode: ${{ github.run_number }}
            Publishing the AAB does not guarantee Google Play policy eligibility.
          files: |
            AndroidApp/app/build/outputs/apk/debug/app-debug.apk
            AndroidApp/app/build/outputs/apk/release/app-release.apk
            AndroidApp/app/build/outputs/bundle/release/app-release.aab
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
