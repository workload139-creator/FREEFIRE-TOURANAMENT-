name: Django checks

on:
  push:
    branches: [main, fix/required-player-upi-withdrawals, feature/fan-tokens-tournament-ledger]
  pull_request:
    branches: [main, fix/required-player-upi-withdrawals]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: test-only-not-for-production
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      DATABASE_URL: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check migration consistency
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Django system checks
        run: python manage.py check
      - name: Run tests
        run: python manage.py test
