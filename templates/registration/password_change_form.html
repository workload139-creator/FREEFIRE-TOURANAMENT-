{% extends "base.html" %}
{% block title %}Change Password | FF Arena{% endblock %}
{% block content %}
<section class="ff-auth-page">
<div class="ff-auth-card">
<span class="ff-page-eyebrow">ACCOUNT SECURITY</span>
<h1>Change password</h1>
<p class="auth-subtitle">Current password verify karke apna naya password set karein.</p>
<form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Update password</button></form>
<div class="auth-links"><a href="{% url 'accounts:profile' %}">Back to profile</a></div>
</div>
</section>
{% endblock %}
