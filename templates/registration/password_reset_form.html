{% extends "base.html" %}
{% block title %}Reset Password | FF Arena{% endblock %}
{% block content %}
<section class="ff-auth-page">
<div class="ff-auth-card">
<span class="ff-page-eyebrow">ACCOUNT RECOVERY</span>
<h1>Reset your password</h1>
<p class="auth-subtitle">Apne FF Arena account ka registered email enter karein.</p>
<form method="post">
{% csrf_token %}
{{ form.as_p }}
<button type="submit">Send secure reset link</button>
</form>
<div class="auth-links"><a href="{% url 'login' %}">Back to login</a><a href="{% url 'accounts:register' %}">Create account</a></div>
</div>
</section>
{% endblock %}
