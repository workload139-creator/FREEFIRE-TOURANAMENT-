{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="description"
          content="Compete in Free Fire tournaments and track your results.">

    <title>{% block title %}FF Tournament{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/variables.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block extra_css %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/">
            <span class="brand-mark">FF</span>
            <span>TOURNAMENT</span>
        </a>

        <nav class="main-nav">
            <a href="/">Home</a>
            <a href="#tournaments">Tournaments</a>
            <a href="#leaderboard">Leaderboard</a>
        </nav>

        <a class="button button-outline" href="/admin/">Admin</a>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>FF Tournament · Compete with skill. Play fair.</p>
    </footer>

    <script src="{% static 'js/main.js' %}" defer></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
